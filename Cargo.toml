[package]
name = "proza"
version = "0.1.0"
edition = "2021"
description = "A lightweight plain-text editor for Linux, modelled on CotEditor's interface (GTK 4)"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
sourceview5 = { version = "0.11", features = ["v5_18"] }
unicode_names2 = "4"
regex = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
